<style>

/* ============================================================
   MSE VALIDATOR PORTAL
   CORPORATE BLUE / WHITE / YELLOW
   ============================================================ */

:root {

  --primary:
    #0b3a82;

  --primary-dark:
    #072a60;

  --primary-light:
    #eaf2ff;

  --accent:
    #f5c400;

  --accent-light:
    #fff8d6;

  --white:
    #ffffff;

  --background:
    #f4f7fb;

  --surface:
    #ffffff;

  --border:
    #dce3ee;

  --text:

   RESET
   ============================================================ */

}


html,
body {

  padding:
    0;

  width:
    100%;

  min-height:
    100%;

}


body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    var(--background);

  color:
    var(--text);

}


/* ============================================================
   APPLICATION
   ============================================================ */

#app {

  min-height:
    100vh;

  display:
    flex;

}


/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {

    fixed;

  left:
    0;

  top:
    0;

  bottom:
    0;

      180deg,

      var(--primary) 100%

    var(--white);

  flex-direction:
    column;

    100;

   SIDEBAR HEADER
   ============================================================ */

  width:
    50px;

  height:
    50px;

    var(--white);

  align-items:
    center;

  justify-content:
    center;

  padding:
    5px;

    0;

   NAVIGATION
   ============================================================ */

  padding:
    18px 12px;

}


.nav-item {

  width:
    100%;

  border:
    none;

  background:
    transparent;

    rgba(255,255,255,0.78);

    var(--white);

    var(--primary);

    0 5px 15px rgba(0,0,0,0.12);

.nav-icon {

  width:
    23px;

  text-align:
    center;

  font-size:
    18px;

}


.nav-divider {

    1px;

    rgba(255,255,255,0.12);

    18px 10px;

}


/* ============================================================
   SIDEBAR FOOTER
   ============================================================ */

.sidebar-footer {

  padding:
    18px;

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  border-top:
    1px solid rgba(255,255,255,0.12);

}


.sidebar-status-dot {

  width:
    9px;

  height:
    9px;

  border-radius:
    50%;

  background:
    var(--success);

  box-shadow:
    0 0 0 4px rgba(29,155,95,0.16);

}


.sidebar-status-title {

  font-size:
    12px;

  font-weight:
    700;

}


.sidebar-status-version {

  font-size:
    10px;

  margin-top:
    3px;

  opacity:
    0.6;

}


/* ============================================================
   MAIN AREA
   ============================================================ */

.main-area {

  margin-left:
    var(--sidebar-width);

  min-height:
    100vh;

  width:
    calc(100% - var(--sidebar-width));

  display:
    flex;

  flex-direction:
    column;

}


/* ============================================================
   HEADER
   ============================================================ */

.top-header {

  height:
    var(--header-height);

  background:
    var(--white);

  border-bottom:
    1px solid var(--border);

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 30px;

  position:
    sticky;

  top:
    0;

  z-index:
    50;

}


.header-portal-name {

  color:
    var(--primary);

  font-size:
    14px;

  font-weight:
    800;

  letter-spacing:
    0.4px;

}


.header-project-title {

  color:
    var(--text-secondary);

  font-size:
    11px;

  margin-top:
    3px;

}


.header-user {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

}


.header-user-info {

  text-align:
    right;

}


.header-user-name {

  font-size:
    13px;

  font-weight:
    700;

}


.header-user-role {

  font-size:
    10px;

  color:
    var(--text-muted);

  margin-top:
    2px;

}


.user-avatar {

  width:
    40px;

  height:
    40px;

  border-radius:
    50%;

  background:
    var(--primary);

  color:
    var(--white);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-weight:
    800;

  border:
    3px solid var(--primary-light);

}


.mobile-menu-button {

  display:
    none;

}


.mobile-menu-button button {

  border:
    none;

  background:
    transparent;

  font-size:
    22px;

  cursor:
    pointer;

}


/* ============================================================
   PAGE CONTENT
   ============================================================ */

.page-content {

  flex:
    1;

  padding:
    30px;

}


.page {

  display:
    none;

}


.page.active {

  display:
    block;

}


/* ============================================================
   WELCOME PANEL
   ============================================================ */

.welcome-panel {

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    15px;

  padding:
    35px;

  display:
    flex;

  align-items:
    center;

  gap:
    30px;

  box-shadow:
    var(--shadow);

  position:
    relative;

  overflow:
    hidden;

}


.welcome-panel::after {

  content:
    "";

  position:
    absolute;

  right:
    -80px;

  top:
    -80px;

  width:
    230px;

  height:
    230px;

  border-radius:
    50%;

  background:
    var(--accent-light);

}


.welcome-logo {

  width:
    110px;

  height:
    110px;

  border:
    1px solid var(--border);

  border-radius:
    18px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    12px;

  background:
    var(--white);

  z-index:
    1;

}


.welcome-logo img {

  max-width:
    100%;

  max-height:
    100%;

  object-fit:
    contain;

}


.welcome-content {

  position:
    relative;

  z-index:
    2;

}


.welcome-badge {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    7px;

  background:
    #eaf8f1;

  color:
    var(--success);

  padding:
    6px 10px;

  border-radius:
    20px;

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    0.7px;

}


.status-dot {

  width:
    7px;

  height:
    7px;

  border-radius:
    50%;

  background:
    var(--success);

}


.welcome-content h1 {

  margin:
    14px 0 5px;

  font-size:
    30px;

  line-height:
    1.15;

}


.welcome-content p {

  margin:
    0;

  color:
    var(--primary);

  font-size:
    15px;

  font-weight:
    700;

}


.welcome-description {

  margin-top:
    14px;

  color:
    var(--text-secondary);

  font-size:
    13px;

  line-height:
    1.7;

  max-width:
    700px;

}


/* ============================================================
   DASHBOARD GRID
   ============================================================ */

.dashboard-grid {

  display:
    grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap:
    18px;

  margin-top:
    22px;

}


.dashboard-card {

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    13px;

  padding:
    22px;

  display:
    flex;

  align-items:
    center;

  gap:
    16px;

  cursor:
    pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;

  position:
    relative;

}


.dashboard-card:hover {

  transform:
    translateY(-3px);

  box-shadow:
    var(--shadow);

  border-color:
    #b9c9e2;

}


.dashboard-card-icon {

  width:
    48px;

  height:
    48px;

  border-radius:
    11px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    22px;

  font-weight:
    700;

  flex-shrink:
    0;

}


.request-icon {

  background:
    var(--primary-light);

  color:
    var(--primary);

}


.validation-icon {

  background:
    #eaf8f1;

  color:
    var(--success);

}


.processed-icon {

  background:
    #fff8d6;

  color:
    #9a7900;

}


.admin-icon {

  background:
    #f0f2f5;

  color:
    #4d596b;

}


.dashboard-card-content {

  flex:
    1;

}


.dashboard-card h3 {

  margin:
    0 0 5px;

  font-size:
    15px;

}


.dashboard-card p {

  margin:
    0;

  font-size:
    12px;

  line-height:
    1.5;

  color:
    var(--text-secondary);

}


.dashboard-card-arrow {

  color:
    var(--text-muted);

  font-size:
    18px;

}


/* ============================================================
   SECTION CARD
   ============================================================ */

.section-card {

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    13px;

  margin-top:
    22px;

  box-shadow:
    0 4px 18px rgba(18,45,80,0.04);

}


.section-card-header {

  padding:
    20px 22px;

  border-bottom:
    1px solid var(--border);

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

}


.section-title {

  font-size:
    14px;

  font-weight:
    800;

}


.section-subtitle {

  font-size:
    11px;

  color:
    var(--text-muted);

  margin-top:
    4px;

}


.section-status {

  display:
    flex;

  align-items:
    center;

  gap:
    7px;

  font-size:
    11px;

  font-weight:
    700;

  color:
    var(--success);

}


.system-info-grid {

  display:
    grid;

  grid-template-columns:
    repeat(4,1fr);

}


.info-item {

  padding:
    20px 22px;

  border-right:
    1px solid var(--border);

}


.info-item:last-child {

  border-right:
    none;

}


.info-label {

  color:
    var(--text-muted);

  font-size:
    9px;

  font-weight:
    800;

  letter-spacing:
    0.8px;

}


.info-value {

  margin-top:
    8px;

  font-size:
    12px;

  font-weight:
    600;

  line-height:
    1.4;

}


/* ============================================================
   PAGE HEADINGS
   ============================================================ */

.page-heading {

  margin-bottom:
    22px;

}


.page-kicker {

  color:
    var(--primary);

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    1px;

}


.page-heading h1 {

  margin:
    7px 0 5px;

  font-size:
    28px;

}


.page-heading p {

  margin:
    0;

  color:
    var(--text-secondary);

  font-size:
    13px;

}


/* ============================================================
   EMPTY MODULE
   ============================================================ */

.empty-module {

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    15px;

  min-height:
    350px;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    30px;

  box-shadow:
    var(--shadow);

}


.empty-module-icon {

  width:
    64px;

  height:
    64px;

  border-radius:
    16px;

  background:
    var(--primary-light);

  color:
    var(--primary);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    28px;

  font-weight:
    800;

}


.empty-module h2 {

  margin:
    18px 0 7px;

  font-size:
    20px;

}


.empty-module p {

  margin:
    0;

  max-width:
    500px;

  color:
    var(--text-secondary);

  font-size:
    13px;

  line-height:
    1.6;

}


/* ============================================================
   FOOTER
   ============================================================ */

.portal-footer {

  background:
    var(--white);

  border-top:
    1px solid var(--border);

  min-height:
    95px;

  padding:
    18px 30px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    18px;

  text-align:
    center;

}


.footer-logo-container {

  max-width:
    150px;

  max-height:
    55px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


.footer-company-logo {

  max-width:
    150px;

  max-height:
    55px;

  object-fit:
    contain;

}


.footer-information {

  border-left:
    1px solid var(--border);

  padding-left:
    18px;

}


.footer-title {

  font-size:
    11px;

  font-weight:
    700;

}


.footer-subtitle {

  font-size:
    10px;

  color:
    var(--text-secondary);

  margin-top:
    3px;

}


.footer-copyright {

  font-size:
    9px;

  color:
    var(--text-muted);

  margin-top:
    4px;

}


/* ============================================================
   LOADING SCREEN
   ============================================================ */

.loading-screen {

  position:
    fixed;

  inset:
    0;

  background:
    rgba(244,247,251,0.98);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  z-index:
    9999;

}


.loading-card {

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    16px;

  padding:
    35px 50px;

  text-align:
    center;

  box-shadow:
    var(--shadow);

}


.loading-spinner {

  width:
    35px;

  height:
    35px;

  border:
    3px solid var(--primary-light);

  border-top-color:
    var(--primary);

  border-radius:
    50%;

  animation:
    spin 0.8s linear infinite;

  margin:
    0 auto 18px;

}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


.loading-title {

  font-weight:
    800;

  color:
    var(--primary);

  font-size:
    15px;

}


.loading-text {

  margin-top:
    5px;

  font-size:
    11px;

  color:
    var(--text-muted);

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 1000px) {

  .sidebar {

    transform:
      translateX(-100%);

    transition:
      transform 0.25s ease;

  }


  .sidebar.mobile-open {

    transform:
      translateX(0);

  }


  .main-area {

    margin-left:
      0;

    width:
      100%;

  }


  .mobile-menu-button {

    display:
      block;

  }


  .top-header {

    padding:
      0 18px;

  }


  .page-content {

    padding:
      20px;

  }


  .system-info-grid {

    grid-template-columns:
      repeat(2,1fr);

  }


  .info-item:nth-child(2) {

    border-right:
      none;

  }


}


@media (max-width: 700px) {

  .header-project-title {

    display:
      none;

  }


  .header-user-info {

    display:
      none;

  }


  .welcome-panel {

    flex-direction:
      column;

    text-align:
      center;

    padding:
      25px;

  }


  .welcome-content h1 {

    font-size:
      24px;

  }


  .dashboard-grid {

    grid-template-columns:
      1fr;

  }


  .system-info-grid {

    grid-template-columns:
      1fr;

  }


  .info-item {

    border-right:
      none;

    border-bottom:
      1px solid var(--border);

  }


  .info-item:last-child {

    border-bottom:
      none;

  }


  .section-card-header {

    align-items:
      flex-start;

    gap:
      12px;

    flex-direction:
      column;

  }


  .portal-footer {

    flex-direction:
      column;

    padding:
      20px;

  }


  .footer-information {

    border-left:
      none;

    border-top:
      1px solid var(--border);

    padding:
      12px 0 0;

  }

}


/* ============================================================
   NEW REQUEST MODULE
   ============================================================ */

.mse-request-module {
  max-width: 1500px;
  margin: 0 auto;
}


/* ============================================================
   PAGE HEADER
   ============================================================ */

.request-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.request-page-kicker {
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

.request-page-header h1 {
  margin: 7px 0 5px;
  font-size: 28px;
}

.request-page-header p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 13px;
}


/* ============================================================
   STATUS
   ============================================================ */

.request-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent-light);
  color: #806400;
  border: 1px solid #f0df8a;
  border-radius: 20px;
  padding: 8px 13px;
  font-size: 11px;
  font-weight: 800;
}

.request-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}


/* ============================================================
   SECTION CARD
   ============================================================ */

.request-section-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.request-section-header {
  padding: 20px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.request-section-title {
  font-size: 15px;
  font-weight: 800;
}

.request-section-subtitle {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.5;
}


/* ============================================================
   REQUEST ID
   ============================================================ */

.request-id-display {
  min-width: 180px;
  text-align: right;
}

.request-id-display span {
  display: block;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .8px;
}

.request-id-display strong {
  display: block;
  margin-top: 5px;
  color: var(--primary);
  font-size: 12px;
}


/* ============================================================
   FORM
   ============================================================ */

.request-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  padding: 22px;
}

.ticket-form-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding-bottom: 10px;
}

.request-form-group {
  min-width: 0;
}

.request-form-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  color: var(--text);
  font-size: 11px;
  font-weight: 800;
}

.request-form-group input,
.request-form-group textarea {
  width: 100%;
