<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MSE Validator Portal</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 245px;
      background: #0b1f3a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .brand {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 10px;
      color: #9fb1c8;
      line-height: 1.4;
    }

    .nav {
      padding: 15px 10px;
      flex: 1;
    }

    .nav-section {
      margin: 14px 10px 7px;
      color: #71849e;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #c8d3e2;
      padding: 11px 12px;
      margin-bottom: 3px;
      border-radius: 7px;
      text-align: left;
      font-size: 12px;
      transition: .15s;
    }

    .nav-item:hover {
      background: rgba(255,255,255,.07);
      color: #ffffff;
    }

    .nav-item.active {
      background: #0b78df;
      color: #ffffff;
      font-weight: 700;
    }

    .sidebar-footer {
      padding: 15px 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 9px;
      color: #8092aa;
    }

    .main {
      margin-left: 245px;
      width: calc(100% - 245px);
      min-height: 100vh;
    }

    .topbar {
      height: 62px;
      background: #ffffff;
      border-bottom: 1px solid #e4e9f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-size: 13px;
      font-weight: 700;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #66758a;
    }

    .user-badge {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #eaf3ff;
      color: #0b78df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .content {
      padding: 24px;
      max-width: 1800px;
      margin: 0 auto;
    }

    /* ============================================================
       PAGE
       ============================================================ */

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .page-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #12213a;
    }

    .page-description {
      margin: 6px 0 0;
      color: #718096;
      font-size: 11px;
      line-height: 1.5;
    }

    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ============================================================
       CARDS
       ============================================================ */

    .card {
      background: #ffffff;
      border: 1px solid #e4e9f0;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15,35,60,.03);
    }

    .card-header {
      padding: 15px 18px;
      border-bottom: 1px solid #edf1f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .card-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      color: #1b2b43;
    }

    .card-description {
      margin: 4px 0 0;
      font-size: 10px;
      color: #7b899c;
    }

    .card-body {
      padding: 18px;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */

    .btn {
      border: 0;
      border-radius: 6px;
      min-height: 34px;
      padding: 8px 13px;
      font-size: 11px;
      font-weight: 700;
      transition: .15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0b78df;
      color: #ffffff;
    }

    .btn-secondary {
      background: #eef2f6;
      color: #40516a;
    }

    .btn-yellow {
      background: #f6c945;
      color: #152238;
    }

    .btn-danger {
      background: #dc3545;
      color: #ffffff;
    }

    .btn-success {
      background: #198754;
      color: #ffffff;
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */

    .dashboard-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(210px,1fr)
        );
      gap: 15px;
      margin-bottom: 20px;
    }

    .dashboard-action {
      border: 1px solid #e4e9f0;
      background: #ffffff;
      border-radius: 10px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      transition: .15s;
    }

    .dashboard-action:hover {
      border-color: #0b78df;
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(11,120,223,.08);
    }

    .dashboard-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #eaf3ff;
      color: #0b78df;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .dashboard-action h3 {
      margin: 0;
      font-size: 13px;
    }

    .dashboard-action p {
      margin: 5px 0 0;
      color: #74839a;
      font-size: 10px;
      line-height: 1.5;
    }

    /* ============================================================
       INFO GRID
       ============================================================ */

    .info-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(160px,1fr)
        );
      gap: 12px;
    }

    .info-item {
      border: 1px solid #edf1f5;
      border-radius: 7px;
      padding: 11px;
      background: #fafbfd;
    }

    .info-label {
      color: #78879b;
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .info-value {
      color: #1e2d43;
      font-size: 12px;
      font-weight: 700;
      word-break: break-word;
    }

    /* ============================================================
       FORMS
       ============================================================ */

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(200px,1fr)
        );
      gap: 13px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;
      margin-bottom: 5px;
      color: #44556c;
      font-size: 10px;
      font-weight: 700;
    }

    .form-control {
      width: 100%;
      border: 1px solid #d9e0e8;
      border-radius: 6px;
      min-height: 35px;
      padding: 8px 10px;
      font-size: 11px;
      outline: none;
      background: #ffffff;
    }

    .form-control:focus {
      border-color: #0b78df;
      box-shadow: 0 0 0 2px rgba(11,120,223,.08);
    }

    textarea.form-control {
      min-height: 180px;
      resize: vertical;
      font-family:
        Consolas,
        "Courier New",
        monospace;
      line-height: 1.5;
    }

    /* ============================================================
       IMPORT
       ============================================================ */

    .file-drop {
      border: 2px dashed #cbd6e4;
      border-radius: 9px;
      padding: 22px;
      text-align: center;
      background: #fbfcfe;
      transition: .15s;
    }

    .file-drop:hover {
      border-color: #0b78df;
      background: #f5faff;
    }

    .file-drop-title {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .file-drop-text {
      font-size: 10px;
      color: #78879b;
      margin-bottom: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(120px,1fr)
        );
      gap: 10px;
    }

    .summary-box {
      background: #f7f9fc;
      border: 1px solid #e7ecf2;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .summary-box.success {
      background: #f0fbf5;
      border-color: #ccebd9;
    }

    .summary-box.error {
      background: #fff4f4;
      border-color: #f0cdcd;
    }

    .summary-number {
      font-size: 20px;
      font-weight: 800;
      color: #17304f;
    }

    .summary-label {
      margin-top: 3px;
      color: #718096;
      font-size: 9px;
      font-weight: 700;
    }

    /* ============================================================
       TABLE
       ============================================================ */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e7ecf2;
      border-radius: 7px;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
      font-size: 10px;
    }

    th {
      background: #f5f7fa;
      color: #53647a;
      text-align: left;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
      padding: 9px;
      border-bottom: 1px solid #dfe5ec;
    }

    td {
      padding: 9px;
      border-bottom: 1px solid #edf1f5;
      vertical-align: top;
      color: #36465d;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .invalid-row {
      background: #fff7f7;
    }

    .error-text {
      color: #c42f3d;
      font-size: 8px;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ============================================================
       STATUS
       ============================================================ */

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 7px;
      border-radius: 20px;
      font-size: 8px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-valid {
      background: #e8f7ef;
      color: #157347;
    }

    .status-invalid {
      background: #fdebed;
      color: #b42333;
    }

    .status-warning {
      background: #fff6d9;
      color: #856404;
    }

    /* ============================================================
       TICKET GROUP
       ============================================================ */

    .ticket-group {
      border: 1px solid #e5eaf0;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #ffffff;
    }

    .ticket-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 13px;
      background: #f8fafc;
      border-bottom: 1px solid #edf1f5;
    }

    .ticket-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .ticket-number {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #0b78df;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .ticket-meta {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mini-badge {
      background: #eef3f8;
      color: #607188;
      border-radius: 20px;
      padding: 4px 7px;
      font-size: 8px;
      font-weight: 700;
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */

    .empty-state {
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 30px;
      color: #b5c1d0;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 13px;
      font-weight: 800;
      color: #526176;
    }

    .empty-text {
      max-width: 450px;
      margin: 5px auto 0;
      color: #8996a8;
      font-size: 10px;
      line-height: 1.5;
    }

    /* ============================================================
       MODAL
       ============================================================ */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8,20,38,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .modal-header {
      padding: 15px 18px;
      border-bottom: 1px solid #e7ecf2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .modal-close {
      border: 0;
      background: transparent;
      font-size: 20px;
      color: #7a8798;
    }

    .modal-body {
      padding: 18px;
    }

    /* ============================================================
       TOAST
       ============================================================ */

    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
      max-width: 420px;
      padding: 12px 15px;
      border-radius: 7px;
      color: #ffffff;
      background: #41546c;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
      font-size: 10px;
      display: none;
    }

    #toast.info {
      display: block;
      background: #0b78df;
    }

    #toast.success {
      display: block;
      background: #198754;
    }

    #toast.error {
      display: block;
      background: #dc3545;
    }

    /* ============================================================
       MOBILE
       ============================================================ */

    @media(max-width: 850px) {

      .sidebar {
        width: 70px;
      }

      .brand {
        padding: 15px 8px;
        text-align: center;
      }

      .brand-title {
        font-size: 11px;
      }

      .brand-subtitle,
      .nav-section,
      .nav-item span,
      .sidebar-footer {
        display: none;
      }

      .nav-item {
        text-align: center;
        padding: 12px 5px;
        font-size: 18px;
      }

      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
      }

      .content {
        padding: 15px;
      }

      .topbar {
        padding: 0 15px;
      }

      .page-header {
        flex-direction: column;
      }

      .page-actions {
        width: 100%;
      }

      .page-actions .btn {
        flex: 1;
      }

    }

  </style>

</head>


<body>

<div class="app">

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-title">
        MSE VALIDATOR
      </div>

      <div class="brand-subtitle">
        Manual Sales Entry<br>
        Validation Portal
      </div>

    </div>


    <nav class="nav">

      <div class="nav-section">
        Main
      </div>

      <button
        class="nav-item active"
        data-page="dashboard"
        onclick="navigate('dashboard')"
      >
        <span>▦</span>
        Dashboard
      </button>


      <button
        class="nav-item"
        data-page="new-request"
        onclick="navigate('new-request')"
      >
        <span>＋</span>
        New Request
      </button>


      <button
        class="nav-item"
        data-page="validation"
        onclick="navigate('validation')"
      >
        <span>✓</span>
        Validation
      </button>


      <button
        class="nav-item"
        data-page="processed"
        onclick="navigate('processed')"
      >
        <span>▤</span>
        Processed
      </button>


      <div class="nav-section">
        System
      </div>

      <button
        class="nav-item"
        data-page="administration"
        onclick="navigate('administration')"
      >
        <span>⚙</span>
        Administration
      </button>

    </nav>


    <div class="sidebar-footer">
      MSE Validator Portal<br>
      Version 1.0.0
    </div>

  </aside>


  <!-- ============================================================
       MAIN
       ============================================================ -->

  <main class="main">

    <header class="topbar">

      <div class="topbar-title">
        Manual Sales Entry Validation
      </div>

      <div class="topbar-user">

        <span id="userNameDisplay">
          Normal User
        </span>

        <div class="user-badge">
          U
        </div>

      </div>

    </header>


    <div
      id="pageContainer"
      class="content"
    ></div>

  </main>

</div>


<!-- ==============================================================
     MODAL
     ============================================================== -->

<div
  id="modalOverlay"
  class="modal-overlay"
  onclick="if(event.target === this) closeModal()"
>

  <div class="modal">

    <div class="modal-header">

      <h2
        id="modalTitle"
        class="modal-title"
      >
        Modal
      </h2>

      <button
        class="modal-close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

  </div>

</div>


<!-- ==============================================================
     TOAST
     ============================================================== -->

<div id="toast"></div>


<script>

/* ============================================================
   01. APPLICATION STATE
   ============================================================ */

const AppState = {

  /* =========================================================
     APPLICATION
     ========================================================= */

  initialized: false,

  currentPage: "dashboard",

  user: {
    name: "",
    role: "Normal User"
  },


  /* =========================================================
     CURRENT REQUEST
     ========================================================= */

  request: null,


  /* =========================================================
     IMPORT
     ========================================================= */

  imported: false,

  importedRows: [],

  validRows: [],

  invalidRows: [],

  groupedTickets: {},


  /* =========================================================
     VALIDATION
     ========================================================= */

  validation: {

    running: false,

    completed: false,

    result: null,

    error: null

  },


  /* =========================================================
     UI
     ========================================================= */

  loading: false,

  toast: null

};


/* ============================================================
   02. APPLICATION INITIALIZATION
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initializeApplication();

  }
);


function initializeApplication() {

  if (AppState.initialized) {
    return;
  }

  AppState.user.name = "Normal User";

  AppState.user.role = "Normal User";

  AppState.initialized = true;

  initializeRequest();

  updateUserDisplay();

  navigate(
    AppState.currentPage
  );

}


/* ============================================================
   03. REQUEST INITIALIZATION
   ============================================================ */

function initializeRequest() {

  AppState.request = {

    requestId:
      generateRequestId(),

    status:
      "Draft",

    createdAt:
      new Date().toISOString(),

    rows: []

  };

}


function generateRequestId() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      now.getDate()
    ).padStart(2,"0");

  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const seconds =
    String(
      now.getSeconds()
    ).padStart(2,"0");

  return (
    "MSE-" +
    year +
    month +
    day +
    "-" +
    hours +
    minutes +
    seconds
  );

}


/* ============================================================
   04. USER DISPLAY
   ============================================================ */

function updateUserDisplay() {

  const element =
    document.getElementById(
      "userNameDisplay"
    );

  if (!element) {
    return;
  }

  element.textContent =
    AppState.user.name ||
    AppState.user.role ||
    "Normal User";

}


/* ============================================================
   05. NAVIGATION
   ============================================================ */

function navigate(page) {

  AppState.currentPage =
    page;

  updateNavigation();

  const container =
    document.getElementById(
      "pageContainer"
    );

  if (!container) {
    return;
  }

  switch (page) {

    case "dashboard":

      renderDashboard(
        container
      );

      break;


    case "new-request":

      renderNewRequest(
        container
      );

      break;


    case "validation":

      renderValidation(
        container
      );

      break;


    case "processed":

      renderProcessed(
        container
      );

      break;


    case "administration":

      renderAdministration(
        container
      );

      break;


    default:

      renderDashboard(
        container
      );

  }

}


function updateNavigation() {

  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          "active",
          button.dataset.page ===
            AppState.currentPage
        );

      }
    );

}


/* ============================================================
   06. DASHBOARD
   ============================================================ */

function renderDashboard(
  container
) {

  const request =
    AppState.request;

  const rows =
    request &&
    request.rows
      ? request.rows.length
      : 0;

  const tickets =
    request &&
    request.rows
      ? countUniqueTickets(
          request.rows
        )
      : 0;


  container.innerHTML = `

    <div class="page-header">

      <div>

        <h1 class="page-title">
          Dashboard
        </h1>

        <p class="page-description">
          Manual Sales Entry validation and transaction management.
        </p>

      </div>

    </div>


    <div class="dashboard-grid">

      <div
        class="dashboard-action"
        onclick="navigate('new-request')"
      >

        <div class="dashboard-icon">
          ＋

/* ============================================================
   08. DEFAULT HEADERS
   ============================================================ */

function getDefaultHeaders() {

  return [

    "#",

    "TICKET ID",

    "STORE",

    "NAME",

    "CARD NUMBER",

    "DOT",

    "STORE CODE",

    "REG. NO.",

    "TRANS. NO.",

    "AMOUNT",

    "ISSUE / CONCERN"

  ];

}


/* ============================================================
   09. HEADER NORMALIZATION
   ============================================================ */

function normalizeHeader(
  value
) {

  return String(
    value || ""
  )
    .toUpperCase()
    .replace(
      /[^A-Z0-9]+/g,
      "_"
    )
    .replace(
      /^_+|_+$/g,
      ""
    );

}


/* ============================================================
   10. HEADER DETECTION
   ============================================================ */

function looksLikeHeader(
  headers
) {

  const required = [

    "TICKET_ID",

    "STORE",

    "CARD_NUMBER",

    "AMOUNT"

  ];


  const found =
    required.filter(
      header =>
        headers.includes(
          header
        )
    );


  return (
    found.length >= 2
  );

}


/* ============================================================
   11. BULK PASTE PARSER
   ============================================================ */

function parseBulkPaste() {

  const textarea =
    document.getElementById(
      "bulkPaste"
    );


  if (!textarea) {
    return;
  }


  const text =
    textarea.value.trim();


  if (!text) {

    showToast(
      "Please paste or upload transaction data first.",
      "error"
    );

    return;

  }


  const lines =
    text
      .split(/\r?\n/)
      .filter(
        line =>
          line.trim() !== ""
      );


  if (!lines.length) {

    showToast(
      "No transaction rows detected.",
      "error"
    );

    return;

  }


  const firstLine =
    lines[0];


  const delimiter =
    detectDelimiter(
      firstLine
    );


  const rawRows =
    lines.map(
      line =>
        parseDelimitedLine(
          line,
          delimiter
        )
    );


  if (!rawRows.length) {

    showToast(
      "Unable to parse imported data.",
      "error"
    );

    return;

  }


  const normalizedHeaders =
    rawRows[0].map(
      header =>
        normalizeHeader(
          header
        )
    );


  let dataRows =
    rawRows;


  let hasHeader =
    looksLikeHeader(
      normalizedHeaders
    );


  if (hasHeader) {

    dataRows =
      rawRows.slice(1);

  }
  else {

    const defaultHeaders =
      getDefaultHeaders();

    dataRows =
      rawRows;

    normalizedHeaders.length =
      0;

    defaultHeaders.forEach(
      header =>
        normalizedHeaders.push(
          normalizeHeader(
            header
          )
        )
    );

  }


  const objects =
    dataRows.map(
      function(values,index) {

        const object = {};

        normalizedHeaders
          .forEach(
            function(header,
              columnIndex) {

              object[header] =
                values[columnIndex] ||
                "";

            }
          );


        object.__sourceRow =
          hasHeader
            ? index + 2
            : index + 1;


        return object;

      }
    );


  processImportedRows(
    objects
  );

}


/* ============================================================
   12. DELIMITER DETECTION
   ============================================================ */

function detectDelimiter(
  line
) {

  const candidates = [

    "\t",

    ",",

    ";",

    "|"

  ];


  let best =
    "\t";

  let highest =
    0;


  candidates.forEach(
    function(delimiter) {

      const count =
        line.split(
          delimiter
        ).length - 1;


      if (
        count > highest
      ) {

        highest =
          count;

        best =
          delimiter;

      }

    }
  );


  return best;

}


/* ============================================================
   13. DELIMITED LINE PARSER
   ============================================================ */

function parseDelimitedLine(
  line,
  delimiter
) {

  const result = [];

  let current = "";

  let quoted = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (
      char === '"'
    ) {

      if (
        quoted &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      }
      else {

        quoted =
          !quoted;

      }

      continue;

    }


    if (
      char === delimiter &&
      !quoted
    ) {

      result.push(
        current.trim()
      );

      current = "";

      continue;

    }


    current += char;

  }


  result.push(
    current.trim()
  );


  return result;

}


/* ============================================================
   14. PROCESS IMPORTED ROWS
   ============================================================ */

function processImportedRows(
  rows
) {

  const processed = [];

  const invalid = [];


  rows.forEach(
    function(source,index) {

      const row =
        normalizeImportedRow(
          source,
          index
        );


      if (
        row.errors.length
      ) {

        invalid.push(
          row
        );

      }

      else {

        processed.push(
          row
        );

      }

    }
  );


  AppState.importedRows =
    processed.concat(
      invalid
    );

  AppState.validRows =
    processed;

  AppState.invalidRows =
    invalid;


  groupImportedRows();


  AppState.imported =
    false;


  refreshImportUI();


  showToast(

    "Import parsed: " +
    rows.length +
    " row(s) detected.",

    invalid.length
      ? "info"
      : "success"

  );

}


/* ============================================================
   15. NORMALIZE IMPORTED ROW
   ============================================================ */

function normalizeImportedRow(
  source,
  index
) {

  const ticketId =
    getField(
      source,
      [
        "TICKET_ID",
        "TICKET",
        "TICKET_NO",
        "TICKET_NUMBER"
      ]
    );


  const store =
    getField(
      source,
      [
        "STORE",
        "STORE_NAME"
      ]
    );


  const name =
    getField(
      source,
      [
        "NAME",
        "CUSTOMER_NAME"
      ]
    );


  const cardInput =
    getField(
      source,
      [
        "CARD_NUMBER",
        "CARD_NO",
        "CARD"
      ]
    );


  const dot =
    getField(
      source,
      [
        "DOT",
        "DATE_OF_TRANSACTION",
        "TRANSACTION_DATE"
      ]
    );


  const storeCode =
    getField(
      source,
      [
        "STORE_CODE",
        "STORECODE"
      ]
    );


  const registrationNo =
    getField(
      source,
      [
        "REG_NO",
        "REG_NO_",
        "REGISTRATION_NO",
        "REGISTRATION_NUMBER"
      ]
    );


  const transactionNo =
    getField(
      source,
      [
        "TRANS_NO",
        "TRANS_NO_",
        "TRANSACTION_NO",
        "TRANSACTION_NUMBER"
      ]
    );


  const amount =
    getField(
      source,
      [
        "AMOUNT",
        "SALES_AMOUNT",
        "TRANSACTION_AMOUNT"
      ]
    );


  const issueInput =
    getField(
      source,
      [
        "ISSUE_CONCERN",
        "ISSUE",
        "CONCERN",
        "ISSUE_REASON"
      ]
    );


  const errors = [];


  const cleanTicketId =
    String(
      ticketId || ""
    )
      .replace(
        /\D/g,
        ""
      )
      .slice(
        0,
        10
      );


  if (
    !isValidTicketId(
      cleanTicketId
    )
  ) {

    errors.push(
      "Invalid Ticket ID"
    );

  }


  if (!store) {

    errors.push(
      "Store is required"
    );

  }


  if (!cardInput) {

    errors.push(
      "Card Number is required"
    );

  }


  const cardInfo =
    analyzeCardNumber(
      cardInput
    );


  if (
    cardInput &&
    !cardInfo.normalized
  ) {

    errors.push(
      "Unable to normalize Card Number"
    );

  }


  if (!amount) {

    errors.push(
      "Amount is required"
    );

  }


  if (!issueInput) {

    errors.push(
      "Issue / Concern is required"
    );

  }


  const normalizedIssue =
    normalizeSentence(
      issueInput
    );


  const dor =
    isValidTicketId(
      cleanTicketId
    )
      ? extractDORFromTicketId(
          cleanTicketId
        )
      : "";


  const ticketSeries =
    isValidTicketId(
      cleanTicketId
    )
      ? extractTicketSeries(
          cleanTicketId
        )
      : "";


  return {

    sourceRow:
      source.__sourceRow ||
      index + 1,

    rowNumber:
      getField(
        source,
        ["#","NO","NUMBER"]
      ) ||
      index + 1,

    ticketId:
      cleanTicketId,

    store:
      store,

    name:
      name,

    cardNumberInput:
      cardInput,

    cardNumber:
      cardInfo.normalized,

    cardType:
      cardInfo.type,

    cardPrefix:
      cardInfo.prefix,

    dot:
      normalizeDateValue(
        dot
      ),

    storeCode:
      storeCode,

    registrationNo:
      registrationNo,

    transactionNo:
      transactionNo,

    amount:
      normalizeAmount(
        amount
      ),

    issue:
      normalizedIssue,

    dor:
      dor,

    ticketSeries:
      ticketSeries,

    errors:
      errors

  };

}


/* ============================================================
   16. GET FIELD
   ============================================================ */

function getField(
  object,
  names
) {

  for (
    let i = 0;
    i < names.length;
    i++
  ) {

    const key =
      normalizeHeader(
        names[i]
      );


    if (
      Object.prototype.hasOwnProperty.call(
        object,
        key
      )
    ) {

      const value =
        object[key];


      if (
        value !== null &&
        value !== undefined &&
        String(value).trim() !== ""
      ) {

        return String(
          value
        ).trim();

      }

    }

  }


  return "";

}


/* ============================================================
   17. TICKET VALIDATION
   ============================================================ */

function isValidTicketId(
  ticketId
) {

  const value =
    String(
      ticketId || ""
    );


  if (
    !/^\d{10}$/.test(
      value
    )
  ) {

    return false;

  }


  const year =
    Number(
      value.substring(
        0,
        2
      )
    );


  const month =
    Number(
      value.substring(
        2,
        4
      )
    );


  const day =
    Number(
      value.substring(
        4,
        6
      )
    );


  if (
    month < 1 ||
    month > 12
  ) {

    return false;

  }


  const fullYear =
    2000 + year;


  const date =
    new Date(
      fullYear,
      month - 1,
      day
    );


  return (

    date.getFullYear() ===
      fullYear &&

    date.getMonth() ===
      month - 1 &&

    date.getDate() ===
      day

  );

}


/* ============================================================
   18. EXTRACT DOR
   ============================================================ */

function extractDORFromTicketId(
  ticketId
) {

  if (
    !isValidTicketId(
      ticketId
    )
  ) {

    return "";

  }


  const year =
    2000 +
    Number(
      ticketId.substring(
        0,
        2
      )
    );


  const month =
    Number(
      ticketId.substring(
        2,
        4
      )
    );


  const day =
    Number(
      ticketId.substring(
        4,
        6
      )
    );


  return (

    String(month)
      .padStart(2,"0") +

    "/" +

    String(day)
      .padStart(2,"0") +

    "/" +

    String(year)

  );

}


/* ============================================================
   19. EXTRACT TICKET SERIES
   ============================================================ */

function extractTicketSeries(
  ticketId
) {

  if (
    !/^\d{10}$/.test(
      String(
        ticketId || ""
      )
    )
  ) {

    return "";

  }


  return String(
    ticketId
  ).substring(6);

}


/* ============================================================
   20. CARD ANALYSIS
   ============================================================ */

function analyzeCardNumber(
  value
) {

  let clean =
    String(
      value || ""
    )
      .replace(
        /[^0-9]/g,
        ""
      );


  if (!clean) {

    return {

      normalized:"",
      type:"",
      prefix:""

    };

  }


  let type =
    "UNKNOWN";


  let prefix =
    clean.substring(
      0,
      4
    );


  let normalized =
    clean;


  if (
    clean.startsWith(
      "8000"
    )
  ) {

    type =
      "BPC 8000";


    if (
      clean.length >= 8
    ) {

      normalized =
        clean.slice(
          -8
        );

    }

  }

  else if (
    clean.startsWith(
      "7000"
    )
  ) {

    type =
      "BPC 7000";

    normalized =
      normalizeSixteenDigitCard(
        clean
      );

  }

  else if (
    clean.startsWith(
      "5000"
    )
  ) {

    type =
      "RPC 5000";

    normalized =
      normalizeSixteenDigitCard(
        clean
      );

  }

  else {

    normalized =
      normalizeBaselineCard(
        clean
      );

  }


  return {

    normalized:
      normalized,

    type:
      type,

    prefix:
      prefix

  };

}


/* ============================================================
   21. BASELINE CARD NORMALIZATION
   ============================================================ */

function normalizeBaselineCard(
  cleanVal
) {

  const len =
    cleanVal.length;


  if (
    len > 16
  ) {

    return (

      cleanVal.substring(
        0,
        1
      ) +

      cleanVal.substring(
        len - 15
      )

    );

  }


  if (
    len >= 11 &&
    len <= 15
  ) {

    return (

      cleanVal.substring(
        0,
        1
      ) +

      "0" +

      cleanVal.substring(
        1
      )

    );

  }


  return cleanVal;

}


/* ============================================================
   22. NORMALIZE 16 DIGIT CARD
   ============================================================ */

function normalizeSixteenDigitCard(
  cleanVal
) {

  const normalized =
    normalizeBaselineCard(
      cleanVal
    );


  if (
    normalized.length === 16
  ) {

    return normalized;

  }


  if (
    normalized.length > 16
  ) {

    return (

      normalized.substring(
        0,
        1
      ) +

      normalized.substring(
        normalized.length - 15
      )

    );

  }


  return normalized;

}


/* ============================================================
   23. SENTENCE NORMALIZATION
   ============================================================ */

function normalizeSentence(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  let text =
    String(
      value
    );


  text =
    text.replace(
      /[^A-Za-z0-9\s]/g,
      " "
    );


  text =
    text.replace(
      /\s+/g,
      " "
    )
    .trim();


  if (!text) {

    return "";

  }


  text =
    text.toLowerCase();


  return (

    text.charAt(0).toUpperCase() +

    text.slice(1)

  );

}


/* ============================================================
   24. DATE NORMALIZATION
   ============================================================ */

function normalizeDateValue(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  if (!text) {

    return "";

  }


  return text;

}


/* ============================================================
   25. AMOUNT NORMALIZATION
   ============================================================ */

function normalizeAmount(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const clean =
    String(
      value
    )
      .replace(
        /,/g,
        ""
      )
      .replace(
        /[^\d.-]/g,
        ""
      );


  if (
    clean === ""
  ) {

    return "";

  }


  const number =
    Number(
      clean
    );


  if (
    Number.isNaN(
      number
    )
  ) {

    return clean;

  }


  return number.toFixed(2);

}


/* ============================================================
   26. GROUP IMPORTED ROWS
   ============================================================ */

function groupImportedRows() {

  const groups = {};


  AppState.importedRows
    .forEach(
      function(row) {

        const key =
          row.ticketId ||

        if (

function acceptImportedData() {

  if (
    !AppState.importedRows.length
  ) {

    showToast(
      "There is no imported data to accept.",
      "error"
    );

    return;

  }


  if (
    AppState.invalidRows.length
  ) {

    showToast(
      "Please remove or correct all invalid rows before accepting the import.",
      "error"
    );

    return;

  }


  AppState.request.rows =
    AppState.validRows.map(
      function(row) {

        return {

          ticketId:
            row.ticketId,

          store:
            row.store,

          name:
            row.name,

          dor:
            row.dor,

          ticketSeries:
            row.ticketSeries,

          cardNumber:
            row.cardNumber,

          cardType:
            row.cardType,

          cardPrefix:
            row.cardPrefix,

          dot:
            row.dot,

          storeCode:
            row.storeCode,

          registrationNo:
            row.registrationNo,

          transactionNo:
            row.transactionNo,

          amount:
            row.amount,

          issue:
            row.issue

        };

      }
    );


  AppState.imported =
    true;


  AppState.request.status =
    "Prepared";


  refreshImportUI();


  showToast(
    "Import accepted. " +
    AppState.request.rows.length +
    " transaction(s) are ready for validation.",
    "success"
  );

}


/* ============================================================
   32. REMOVE INVALID ROWS
   ============================================================ */

function removeInvalidRows() {

  if (
    !AppState.invalidRows.length
  ) {

    showToast(
      "There are no invalid rows to remove.",
      "info"
    );

    return;

  }


  AppState.importedRows =
    AppState.importedRows.filter(
      row =>
        !row.errors.length
    );


  AppState.validRows =
    AppState.importedRows.slice();


  AppState.invalidRows =
    [];


  groupImportedRows();

  refreshImportUI();


  showToast(
    "Invalid rows removed.",
    "success"
  );

}


/* ============================================================
   33. REMOVE ONE IMPORTED ROW
   ============================================================ */

function removeImportedRow(
  index
) {

  if (
    index < 0 ||
    index >=
      AppState.importedRows.length
  ) {

    return;

  }


  AppState.importedRows.splice(
    index,
    1
  );


  AppState.validRows =
    AppState.importedRows.filter(
      row =>
        !row.errors.length
    );


  AppState.invalidRows =
    AppState.importedRows.filter(
      row =>
        row.errors.length
    );


  groupImportedRows();

  refreshImportUI();

}

/* ============================================================
   39. FILE IMPORT
   ============================================================ */

function handleFileImport(
  event
) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const textarea =
        document.getElementById(
          "bulkPaste"
        );


      if (textarea) {

        textarea.value =
          e.target.result;

      }


      parseBulkPaste();

    };


  reader.onerror =
    function() {

      showToast(
        "Unable to read the selected file.",
        "error"
      );

    };


  reader.readAsText(
    file
  );


  event.target.value =
    "";

}

/* ============================================================
   41. RUN VALIDATION
   ============================================================ */

function runValidation() {

  if (
    !AppState.request ||
    !AppState.request.rows ||
    !AppState.request.rows.length
  ) {

    showToast(
      "No transactions available for validation.",
      "error"
    );

    return;

  }


  if (
    AppState.validation.running
  ) {

    showToast(
      "Validation is already running.",
      "info"
    );

    return;

  }


  AppState.validation.running =
    true;

  AppState.validation.completed =
    false;

  AppState.validation.error =
    null;

  AppState.request.status =
    "Validation Pending";


  showToast(
    "Request is prepared for the SYSTEM validation engine.",
    "info"
  );


  /*
   * ============================================================
   * SYSTEM VALIDATION INTEGRATION POINT
   * ============================================================
   *
   * The actual server-side SYSTEM comparison should be connected
   * here.
   *
   * Example future architecture:
   *
   * google.script.run
   *   .withSuccessHandler(handleValidationResult)
   *   .withFailureHandler(handleValidationError)
   *   .validateMSERequest(
   *      AppState.request
   *   );
   *
   * DO NOT place the SYSTEM comparison logic directly inside
   * this client-side function.
   *
   * The browser should prepare the request.
   * The Apps Script server should perform the authoritative
   * SYSTEM-sheet validation.
   */

  setTimeout(
    function() {

      AppState.validation.running =
        false;

      AppState.validation.completed =
        false;

      renderValidation(
        document.getElementById(
          "pageContainer"
        )
      );

    },
    500
  );

}

/* ============================================================
   44. COUNT UNIQUE TICKETS
   ============================================================ */

function countUniqueTickets(
  rows
) {

  return new Set(
    rows.map(
      row =>
        row.ticketId
    )
  ).size;

}


/* ============================================================
   45. INFO ITEM
   ============================================================ */

function infoItem(
  label,
  value
) {

  return `

    <div class="info-item">

      <div class="info-label">
        ${escapeHTML(
          label
        )}
      </div>

      <div class="info-value">
        ${escapeHTML(
          value
        )}
      </div>

    </div>

  `;

}


/* ============================================================
   46. EMPTY STATE
   ============================================================ */

function emptyState(
  title,
  text
) {

  return `

    <div class="empty-state">

      <div class="empty-icon">
        ▤
      </div>

      <div class="empty-title">

        ${escapeHTML(
          title
        )}

      </div>

      <div class="empty-text">

        ${escapeHTML(
          text
        )}

      </div>

    </div>

  `;

}


/* ============================================================
   47. MODAL
   ============================================================ */

function openModal(
  title,
  body
) {

  const overlay =
    document.getElementById(
      "modalOverlay"
    );


  const titleElement =
    document.getElementById(
      "modalTitle"
    );


  const bodyElement =
    document.getElementById(
      "modalBody"
    );


  if (!overlay) {
    return;
  }


  if (titleElement) {

    titleElement.textContent =
      title;

  }


  if (bodyElement) {

    bodyElement.innerHTML =
      body;

  }


  overlay.classList.add(
    "show"
  );

}


function closeModal() {

  const overlay =
    document.getElementById(
      "modalOverlay"
    );


  if (!overlay) {
    return;
  }


  overlay.classList.remove(
    "show"
  );

}


/* ============================================================
   48. TOAST
   ============================================================ */

let toastTimer =
  null;


function showToast(
  message,
  type
) {

  const toast =
    document.getElementById(
      "toast"
    );


  if (!toast) {
    return;
  }


  clearTimeout(
    toastTimer
  );


  toast.className =
    "";


  toast.id =
    "toast";


  toast.classList.add(
    type || "info"
  );


  toast.textContent =
    message;


  toast.style.display =
    "block";


  toastTimer =
    setTimeout(
      function() {

        toast.className =
          "";

        toast.style.display =
          "none";

      },
      4500
    );

}


/* ============================================================
   49. ESCAPE HTML
   ============================================================ */

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   50. DRAG & DROP FILE IMPORT
   ============================================================ */

document.addEventListener(
  "dragover",
  function(event) {

    const drop =
      event.target.closest(
        ".file-drop"
      );


    if (drop) {

      event.preventDefault();

      drop.style.borderColor =
        "#0b78df";

      drop.style.background =
        "#f5faff";

    }

  }
);


document.addEventListener(
  "dragleave",
  function(event) {

    const drop =
      event.target.closest(
        ".file-drop"
      );


    if (drop) {

      drop.style.borderColor =
        "";

      drop.style.background =
        "";

    }

  }
);


document.addEventListener(
  "drop",
  function(event) {

    const drop =
      event.target.closest(
        ".file-drop"
      );


    if (!drop) {
      return;
    }


    event.preventDefault();


    drop.style.borderColor =
      "";

    drop.style.background =
      "";


    const file =
      event.dataTransfer.files &&
      event.dataTransfer.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const textarea =
          document.getElementById(
            "bulkPaste"
          );


        if (textarea) {

          textarea.value =
            e.target.result;

        }


        parseBulkPaste();

      };


    reader.onerror =
      function() {

        showToast(
          "Unable to read the dropped file.",
          "error"
        );

      };


    reader.readAsText(
      file
    );

  }
);

</script>
