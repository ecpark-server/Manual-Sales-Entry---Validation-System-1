<script>

/* ============================================================
   MSE VALIDATOR PORTAL
   CLIENT APPLICATION
   ============================================================ */


/* ============================================================
   APPLICATION STATE
   ============================================================ */

const AppState = {

  currentPage:
    "dashboard",

  sidebarOpen:
    false,

  config:
    null,

  transactions:
    [],

  transactionSequence:
    0,

  requestDraft:
    null

};


/* ============================================================
   REQUEST STATE
   ============================================================ */

const RequestState = {

  requestId:
    "",

  preparedBy:
    "Normal User",

  preparedDate:
    "",

  tickets:
    [],

  initialized:
    false

};


/* ============================================================
   INITIALIZE
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    initializePortal();

  }
);


/* ============================================================
   INITIALIZE PORTAL
   ============================================================ */

function initializePortal() {

  google.script.run

    .withSuccessHandler(
      function (config) {

        AppState.config =
          config;

        applyPortalConfig(
          config
        );

        hideLoadingScreen();

      }
    )

    .withFailureHandler(
      function (error) {

        console.error(
          "Portal initialization failed:",
          error
        );

        hideLoadingScreen();

      }
    )

    .getPortalConfig();

}


/* ============================================================
   APPLY CONFIGURATION
   ============================================================ */

function applyPortalConfig(
  config
) {

  if (!config) {

    return;

  }


  /* ----------------------------------------------------------
     PROJECT LOGO
     ---------------------------------------------------------- */

  if (config.projectLogo) {

    const sidebarLogo =
      document.getElementById(
        "sidebarProjectLogo"
      );

    const dashboardLogo =
      document.getElementById(
        "dashboardProjectLogo"
      );


    if (sidebarLogo) {

      sidebarLogo.src =
        config.projectLogo;

    }


    if (dashboardLogo) {

      dashboardLogo.src =
        config.projectLogo;

    }

  }


  /* ----------------------------------------------------------
     FOOTER LOGO
     ---------------------------------------------------------- */

  if (config.footerLogo) {

    const footerLogo =
      document.getElementById(
        "footerCompanyLogo"
      );


    if (footerLogo) {

      footerLogo.src =
        config.footerLogo;

    }

  }


  /* ----------------------------------------------------------
     PORTAL NAME
     ---------------------------------------------------------- */

  const portalName =
    document.getElementById(
      "headerPortalName"
    );


  if (
    portalName &&
    config.portalName
  ) {

    portalName.textContent =
      config.portalName.toUpperCase();

  }


  /* ----------------------------------------------------------
     PROJECT TITLE
     ---------------------------------------------------------- */

  const projectTitle =
    document.getElementById(
      "headerProjectTitle"
    );


  if (
    projectTitle &&
    config.projectTitle
  ) {

    projectTitle.textContent =
      config.projectTitle;

  }


  /* ----------------------------------------------------------
     USER
     ---------------------------------------------------------- */

  if (config.user) {

    const userName =
      document.getElementById(
        "headerUserName"
      );

    const userRole =
      document.getElementById(
        "headerUserRole"
      );

    const userInitials =
      document.getElementById(
        "headerUserInitials"
      );


    if (userName) {

      userName.textContent =
        config.user.name || "";

    }


    if (userRole) {

      userRole.textContent =
        formatRole(
          config.user.role
        );

    }


    if (userInitials) {

      userInitials.textContent =
        config.user.initials || "";

    }

  }

}


/* ============================================================
   FORMAT ROLE
   ============================================================ */

function formatRole(
  role
) {

  if (!role) {

    return "";

  }


  return String(role)
    .toLowerCase()
    .replace(
      /\b\w/g,
      function (letter) {

        return letter.toUpperCase();

      }
    );

}


/* ============================================================
   NAVIGATION
   ============================================================ */

function navigateTo(
  page
) {

  if (!page) {

    return;

  }


  page =
    String(page)
      .trim()
      .toLowerCase();


  const supportedPages = [

    "dashboard",
    "request",
    "locate",
    "release"

  ];


  if (
    !supportedPages.includes(
      page
    )
  ) {

    console.warn(
      "Unknown navigation page:",
      page
    );

    return;

  }


  AppState.currentPage =
    page;


  /* ----------------------------------------------------------
     HIDE ALL PAGES
     ---------------------------------------------------------- */

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      function (element) {

        element.classList.remove(
          "active"
        );

      }
    );


  /* ----------------------------------------------------------
     SHOW SELECTED PAGE
     ---------------------------------------------------------- */

  const selectedPage =
    document.getElementById(
      "page-" + page
    );


  if (selectedPage) {

    selectedPage.classList.add(
      "active"
    );

  }


  /* ----------------------------------------------------------
     UPDATE NAVIGATION
     ---------------------------------------------------------- */

  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      function (element) {

        element.classList.remove(
          "active"
        );

      }
    );


  const selectedNav =
    document.querySelector(
      `.nav-item[data-page="${page}"]`
    );


  if (selectedNav) {

    selectedNav.classList.add(
      "active"
    );

  }


  /* ----------------------------------------------------------
     MOBILE SIDEBAR
     ---------------------------------------------------------- */

  if (
    window.innerWidth <= 1000
  ) {

    closeSidebar();

  }


  /* ----------------------------------------------------------
     SCROLL TOP
     ---------------------------------------------------------- */

  window.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });


  /* ----------------------------------------------------------
     PAGE INITIALIZATION
     ---------------------------------------------------------- */

  initializePage(
    page
  );

}


/* ============================================================
   PAGE INITIALIZATION ROUTER
   ============================================================ */

function initializePage(
  page
) {

  switch (page) {

    case "dashboard":

      initializeDashboardModule();

      break;


    case "request":

      initializeRequestModule();

      break;


    case "locate":

      initializeLocateModule();

      break;


    case "release":

      initializeReleaseModule();

      break;


    default:

      break;

  }

}


/* ============================================================
   DASHBOARD MODULE
   ============================================================ */

function initializeDashboardModule() {

}


/* ============================================================
   LOCATE MODULE
   ============================================================ */

function initializeLocateModule() {

  console.log(
    "Locate page initialized."
  );


  if (
    typeof initializeLocateCard ===
    "function"
  ) {

    initializeLocateCard();

  }

}


/* ============================================================
   RELEASE MODULE
   ============================================================ */

function initializeReleaseModule() {

  console.log(
    "Release page initialized."
  );


  if (
    typeof initializeReleaseCard ===
    "function"
  ) {

    initializeReleaseCard();

  }

}


/* ============================================================
   SIDEBAR
   ============================================================ */

function toggleSidebar() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  if (!sidebar) {

    return;

  }


  AppState.sidebarOpen =
    !AppState.sidebarOpen;


  sidebar.classList.toggle(
    "mobile-open",
    AppState.sidebarOpen
  );

}


/* ============================================================
   CLOSE SIDEBAR
   ============================================================ */

function closeSidebar() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  if (!sidebar) {

    return;

  }


  AppState.sidebarOpen =
    false;


  sidebar.classList.remove(
    "mobile-open"
  );

}


/* ============================================================
   HIDE LOADING SCREEN
   ============================================================ */

function hideLoadingScreen() {

  const loading =
    document.getElementById(
      "loadingScreen"
    );


  if (!loading) {

    return;

  }


  loading.style.opacity =
    "0";

  loading.style.transition =
    "opacity 0.25s ease";


  setTimeout(
    function () {

      loading.style.display =
        "none";

    },
    250
  );

}


/* ============================================================
   WINDOW RESIZE
   ============================================================ */

window.addEventListener(
  "resize",
  function () {

    if (
      window.innerWidth > 1000
    ) {

      closeSidebar();

    }

  }
);


/* ============================================================
   ESCAPE KEY
   ============================================================ */

document.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Escape"
    ) {

      closeSidebar();

    }

  }
);


/* ============================================================
   REQUEST MODULE
   ============================================================ */

function initializeRequestModule() {

  if (
    RequestState.initialized
  ) {

    return;

  }


  RequestState.initialized =
    true;


  generateRequestId();

  setRequestPreparedDate();

  addTicket();

}


/* ============================================================
   GENERATE REQUEST ID
   ============================================================ */

function generateRequestId() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const time =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    ) +

    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    ) +

    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    );


  RequestState.requestId =
    "MSE-" +
    year +
    month +
    day +
    "-" +
    time;


  const field =
    document.getElementById(
      "requestId"
    );


  if (field) {

    field.value =
      RequestState.requestId;

  }

}


/* ============================================================
   PREPARED DATE
   ============================================================ */

function setRequestPreparedDate() {

  const now =
    new Date();


  const formatted =
    now.toLocaleDateString(
      "en-PH",
      {

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"

      }
    );


  RequestState.preparedDate =
    formatted;


  const field =
    document.getElementById(
      "requestPreparedDate"
    );


  if (field) {

    field.value =
      formatted;

  }

}


/* ============================================================
   ADD TICKET
   ============================================================ */

function addTicket() {

  RequestState.tickets.push({

    ticketId:
      "",

    dor:
      "",

    ticketSeries:
      "",

    transactions:
      []

  });


  renderTickets();

}


/* ============================================================
   REMOVE TICKET
   ============================================================ */

function removeTicket(
  index
) {

  if (
    RequestState.tickets.length <= 1
  ) {

    showRequestMessage(
      "At least one ticket is required.",
      "error"
    );

    return;

  }


  RequestState.tickets.splice(
    index,
    1
  );


  renderTickets();

}


/* ============================================================
   RENDER TICKETS
   ============================================================ */

function renderTickets() {

  const container =
    document.getElementById(
      "ticketContainer"
    );


  if (!container) {

    return;

  }


  container.innerHTML =
    "";


  RequestState.tickets.forEach(
    function (
      ticket,
      index
    ) {

      container.insertAdjacentHTML(
        "beforeend",
        buildTicketHTML(
          ticket,
          index
        )
      );

    }
  );


  RequestState.tickets.forEach(
    function (
      ticket,
      index
    ) {

      const ticketInput =
        document.getElementById(
          "ticketId-" + index
        );


      if (ticketInput) {

        ticketInput.addEventListener(
          "input",
          function () {

            handleTicketIdInput(
              index,
              this.value
            );

          }
        );

      }

    }
  );

}


/* ============================================================

              </div>

            <button
              type="button"

            >
              ＋ Add Transaction

          </div>


          <div

          >

            ${
              ticket.transactions.length === 0
              ?

                    No transactions added

              buildTransactionRows(

            }

/* ============================================================
   UPDATE TRANSACTION FIELD
   ============================================================ */

function updateTransactionField(
  ticketIndex,
  transactionIndex,
  field,
  value
) {

  const ticket =
    RequestState.tickets[
      ticketIndex
    ];


  if (!ticket) {

    return;

  }


  const transaction =
    ticket.transactions[
      transactionIndex
    ];


  if (!transaction) {

    return;

  }


  transaction[field] =
    value;


  /*
   * Issue / Concern immediately updates Remarks.
   */

  if (
    field === "issue"
  ) {

    transaction.remarks =
      generateTransactionRemarks(
        ticket,
        transaction
      );

  }


  /*
   * Card Number immediately updates Config No.
   */

  if (
    field === "cardNumber"
  ) {

    transaction.configNo =
      generateConfigNumber(
        transaction.cardNumber
      );

  }

}


/* ============================================================
   NORMALIZE TRANSACTION TEXT
   ============================================================ */

function normalizeTransactionText(
  ticketIndex,
  transactionIndex,
  field,
  input
) {

  const ticket =
    RequestState.tickets[
      ticketIndex
    ];


  if (!ticket) {

    return;

  }


  const transaction =
    ticket.transactions[
      transactionIndex
    ];


  if (!transaction) {

    return;

  }


  const normalized =
    normalizeSentence(
      input
      ?
      input.value
      :
      transaction[field]
    );


  transaction[field] =
    normalized;


  if (input) {

    input.value =
      normalized;

  }

}

/* ============================================================
   GENERATE TRANSACTION REMARKS
   ============================================================ */

function generateTransactionRemarks(
  ticket,
  transaction
) {

  if (!ticket) {

    return "";

  }


  const ticketId =
    String(
      ticket.ticketId || ""
    ).trim();


  const normalizedIssue =
    normalizeSentence(
      transaction
      ?
      transaction.issue
      :
      ""
    );


  if (
    !ticketId &&
    !normalizedIssue
  ) {

    return "";

  }


  if (
    ticketId &&
    normalizedIssue
  ) {

    return (
      ticketId +
      " " +
      normalizedIssue
    );

  }


  if (ticketId) {

    return ticketId;

  }


  return normalizedIssue;

}


/* ============================================================
   TICKET ID INPUT
   ============================================================ */

function handleTicketIdInput(
  index,
  value
) {

  if (
    !RequestState.tickets[index]
  ) {

    return;

  }


  const cleanValue =
    String(value || "")
      .replace(
        /\D/g,
        ""
      )
      .slice(
        0,
        10
      );


  const input =
    document.getElementById(
      "ticketId-" + index
    );


  if (input) {

    input.value =
      cleanValue;

  }


  RequestState.tickets[index].ticketId =
    cleanValue;


  if (
    isValidTicketId(
      cleanValue
    )
  ) {

    RequestState.tickets[index].dor =
      extractDORFromTicketId(
        cleanValue
      );


    RequestState.tickets[index].ticketSeries =
      extractTicketSeries(
        cleanValue
      );

  } else {

    RequestState.tickets[index].dor =
      "";

    RequestState.tickets[index].ticketSeries =
      "";

  }


  /*
   * Update all existing transaction remarks
   * because Remarks depend on Ticket ID.
   */

  const ticket =
    RequestState.tickets[index];


  ticket.transactions.forEach(
    function (transaction, transactionIndex) {

      transaction.remarks =
        generateTransactionRemarks(
          ticket,
          transaction
        );


      const remarks =
        document.getElementById(
          "remarks-" +
          index +
          "-" +
          transactionIndex
        );


      if (remarks) {

        remarks.value =
          transaction.remarks;

      }

    }
  );


  updateTicketValidationUI(
    index
  );

}


/* ============================================================
   VALIDATE TICKET ID
   ============================================================ */

function isValidTicketId(
  ticketId
) {

  const value =
    String(
      ticketId || ""
    );


  if (
    !/^\d{10}$/.test(
      value
    )
  ) {

    return false;

  }


  const year =
    Number(
      value.substring(
        0,
        2
      )
    );


  const month =
    Number(
      value.substring(
        2,
        4
      )
    );


  const day =
    Number(
      value.substring(
        4,
        6
      )
    );


  if (
    month < 1 ||
    month > 12
  ) {

    return false;

  }


  if (
    day < 1 ||
    day > 31
  ) {

    return false;

  }


  const fullYear =
    2000 +
    year;


  const testDate =
    new Date(
      fullYear,
      month - 1,
      day
    );


  return (

    testDate.getFullYear() ===
      fullYear &&

    testDate.getMonth() ===
      month - 1 &&

    testDate.getDate() ===
      day

  );

}


/* ============================================================
   EXTRACT DOR
   ============================================================ */

function extractDORFromTicketId(
  ticketId
) {

  const value =
    String(
      ticketId || ""
    );


  if (
    !isValidTicketId(
      value
    )
  ) {

    return "";

  }


  const year =
    2000 +
    Number(
      value.substring(
        0,
        2
      )
    );


  const month =
    Number(
      value.substring(
        2,
        4
      )
    );


  const day =
    Number(
      value.substring(
        4,
        6
      )
    );


  return (

    String(month).padStart(
      2,
      "0"
    ) +

    "/" +

    String(day).padStart(
      2,
      "0"
    ) +

    "/" +

    String(year)

  );

}


/* ============================================================
   EXTRACT TICKET SERIES
   ============================================================ */

function extractTicketSeries(
  ticketId
) {

  const value =
    String(
      ticketId || ""
    );


  if (
    !/^\d{10}$/.test(
      value
    )
  ) {

    return "";

  }


  return value.substring(
    6
  );

}


/* ============================================================
   TICKET VALIDATION MESSAGE
   ============================================================ */

function getTicketValidationMessage(
  ticketId
) {

  if (!ticketId) {

    return "Enter the 10-digit Ticket ID.";

  }


  if (
    isValidTicketId(
      ticketId
    )
  ) {

    const dor =
      extractDORFromTicketId(
        ticketId
      );


    return (
      "✓ Valid Ticket ID — DOR: " +
      dor
    );

  }


  return (
    "✕ Invalid Ticket ID. Expected YYMMDDSeries."
  );

}


/* ============================================================
   UPDATE TICKET VALIDATION UI
   ============================================================ */

function updateTicketValidationUI(
  index
) {

  const ticket =
    RequestState.tickets[
      index
    ];


  if (!ticket) {

    return;

  }


  const input =
    document.getElementById(
      "ticketId-" + index
    );


  const message =
    document.getElementById(
      "ticketMessage-" + index
    );


  const dor =
    document.getElementById(
      "dor-" + index
    );


  const series =
    document.getElementById(
      "ticketSeries-" + index
    );


  if (
    !input ||
    !message ||
    !dor
  ) {

    return;

  }


  input.classList.remove(
    "input-valid",
    "input-invalid"
  );


  message.classList.remove(
    "valid",
    "invalid"
  );


  if (
    !ticket.ticketId
  ) {

    message.textContent =
      "Enter the 10-digit Ticket ID.";


    dor.value =
      "";


    if (series) {

      series.value =
        "";

    }


    return;

  }


  if (
    isValidTicketId(
      ticket.ticketId
    )
  ) {

    input.classList.add(
      "input-valid"
    );


    message.classList.add(
      "valid"
    );


    const calculatedDOR =
      extractDORFromTicketId(
        ticket.ticketId
      );


    const calculatedSeries =
      extractTicketSeries(
        ticket.ticketId
      );


    dor.value =
      calculatedDOR;


    if (series) {

      series.value =
        calculatedSeries;

    }


    message.textContent =
      "✓ Valid Ticket ID — DOR: " +
      calculatedDOR;

  } else {

    input.classList.add(
      "input-invalid"
    );


    message.classList.add(
      "invalid"
    );


    dor.value =
      "";


    if (series) {

      series.value =
        "";

    }


    message.textContent =
      getTicketValidationMessage(
        ticket.ticketId
      );

  }

}

) {

  const normalized =
    normalizeCardNumber(
      cardNumber

  if (!normalized) {

   * equal to the normalized card number.
   *
   * For example:
   *
   * Card Number:
   * 5000000009381890
   *
   * Config No.:
   * 5000000009381890
   */

  return normalized;

/* ============================================================
   CARD NUMBER NORMALIZATION
   ============================================================ */

function normalizeCardNumber(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  let cleanVal =
    String(value)
      .replace(
        /[^0-9]/g,
        ""
      );


  if (
    cleanVal === ""
  ) {

    return "";

  }


  /*
   * ==========================================================
   * BPC 8000
   * ==========================================================
   *
   * Only the final 8 digits are retained.
   */

  if (
    cleanVal.startsWith(
      "8000"
    )
  ) {

    if (
      cleanVal.length >= 8
    ) {

      return cleanVal.slice(
        -8
      );

    }


    return cleanVal;

  }


  /*
   * ==========================================================
   * BPC 7000
   * ==========================================================
   */

  if (
    cleanVal.startsWith(
      "7000"
    )
  ) {

    return normalizeSixteenDigitCard(
      cleanVal
    );

  }


  /*
   * ==========================================================
   * RPC 5000
   * ==========================================================
   */

  if (
    cleanVal.startsWith(
      "5000"
    )
  ) {

    return normalizeSixteenDigitCard(
      cleanVal
    );

  }


  /*
   * ==========================================================
   * UNKNOWN PREFIX
   * ==========================================================
   */

  return normalizeBaselineCard(
    cleanVal
  );

}


/* ============================================================
   BASELINE CARD NORMALIZATION
   ============================================================ */

function normalizeBaselineCard(
  cleanVal
) {

  const len =
    cleanVal.length;


  /*
   * More than 16 digits:
   *
   * Keep first digit and final 15 digits.
   */

  if (
    len > 16
  ) {

    return (

      cleanVal.substring(
        0,
        1
      ) +

      cleanVal.substring(
        len - 15
      )

    );

  }


  /*
   * 11–15 digits:
   *
   * Insert zero after first digit.
   */

  if (
    len >= 11 &&
    len <= 15
  ) {

    return (

      cleanVal.substring(
        0,
        1
      ) +

      "0" +

      cleanVal.substring(
        1
      )

    );

  }


  return cleanVal;

}


/* ============================================================
   NORMALIZE TO 16 DIGITS
   ============================================================ */

function normalizeSixteenDigitCard(
  cleanVal
) {

  const normalized =
    normalizeBaselineCard(
      cleanVal
    );


  if (
    normalized.length === 16
  ) {

    return normalized;

  }


  if (
    normalized.length > 16
  ) {

    return (

      normalized.substring(
        0,
        1
      ) +

      normalized.substring(
        normalized.length - 15
      )

    );

  }


  return normalized;

}


/* ============================================================
   SENTENCE CASE / TEXT NORMALIZATION
   ============================================================ */

function normalizeSentence(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  let text =
    String(value);


  /*
   * Remove special characters.
   *
   * Keep:
   * A-Z
   * a-z
   * 0-9
   * spaces
   */

  text =
    text.replace(
      /[^A-Za-z0-9\s]/g,
      " "
    );


  /*
   * Collapse multiple spaces.
   */

  text =
    text.replace(
      /\s+/g,
      " "
    )
    .trim();


  if (
    text === ""
  ) {

    return "";

  }


  /*
   * Proper sentence case:
   *
   * CYWARE POS ERROR
   *
   * becomes
   *
   * Cyware pos error
   */

  text =
    text.toLowerCase();


  text =
    text.charAt(0).toUpperCase() +
    text.slice(1);


  return text;

}

}


/* ============================================================
   VALIDATE COMPLETE REQUEST
   ============================================================ */

function validateRequest() {

  if (
    !validateRequestHeader()
  ) {

    return false;

  }


  for (
    let i = 0;
    i < RequestState.tickets.length;
    i++
  ) {

    const ticket =
      RequestState.tickets[
        i
      ];


    /* --------------------------------------------------------
       TICKET ID
       -------------------------------------------------------- */

    if (
      !isValidTicketId(
        ticket.ticketId
      )
    ) {

      showRequestMessage(
        "Ticket #" +
        (i + 1) +
        " has an invalid Ticket ID.",
        "error"
      );


      return false;

    }


    /* --------------------------------------------------------
       TRANSACTION REQUIRED
       -------------------------------------------------------- */

    if (
      ticket.transactions.length === 0
    ) {

      showRequestMessage(
        "Ticket #" +
        (i + 1) +
        " requires at least one transaction.",
        "error"
      );


      return false;

    }


    /* --------------------------------------------------------
       TRANSACTION VALIDATION
       -------------------------------------------------------- */

    for (
      let j = 0;
      j < ticket.transactions.length;
      j++
    ) {

      const transaction =
        ticket.transactions[
          j
        ];


      /*
       * STORE
       */

      if (
        !String(
          transaction.store || ""
        ).trim()
      ) {

        showRequestMessage(
          "Ticket #" +
          (i + 1) +
          ", Transaction #" +
          (j + 1) +
          " requires a Store.",
          "error"
        );


        return false;

      }


      /*
       * CARD NUMBER
       */

      if (
        !String(
          transaction.cardNumber || ""
        ).trim()
      ) {

        showRequestMessage(
          "Ticket #" +
          (i + 1) +
          ", Transaction #" +
          (j + 1) +
          " requires a Card Number.",
          "error"
        );


        return false;

      }


      /*
       * NORMALIZE CARD BEFORE VALIDATION.
       */

      transaction.cardNumber =
        normalizeCardNumber(
          transaction.cardNumber
        );


      /*
       * GENERATE CONFIG NO.
       */

      transaction.configNo =
        generateConfigNumber(
          transaction.cardNumber
        );


      /*
       * NORMALIZE ISSUE.
       */

      transaction.issue =
        normalizeSentence(
          transaction.issue
        );


      /*
       * AUTO GENERATE REMARKS.
       */

      transaction.remarks =
        generateTransactionRemarks(
          ticket,
          transaction
        );

    }

  }


  return true;

}


/* ============================================================
   GET CURRENT REQUEST DRAFT
   ============================================================ */

function getCurrentRequestDraft() {

  return structuredClone(
    RequestState
  );

}


/* ============================================================
   REQUEST MESSAGE
   ============================================================ */

function showRequestMessage(
  message,
  type
) {

  const existing =
    document.getElementById(
      "requestMessage"
    );


  if (existing) {

    existing.remove();

  }


  const element =
    document.createElement(
      "div"
    );


  element.id =
    "requestMessage";


  const background =
    type === "success"
      ?
      "#eaf8f1"
      :
      "#fff1f1";


  const border =
    type === "success"
      ?
      "#bde6cf"
      :
      "#efc3c3";


  const color =
    type === "success"
      ?
      "#1d7f4d"
      :
      "#a52b2b";


  element.style.cssText = `

    position:fixed;

    right:25px;

    bottom:25px;

    max-width:420px;

    background:${background};

    border:1px solid ${border};

    color:${color};

    border-radius:10px;

    padding:13px 16px;

    box-shadow:
      0 10px 30px
      rgba(18,45,80,0.15);

    font-size:11px;

    font-weight:700;

    line-height:1.5;

    z-index:9999;

  `;


  element.textContent =
    message;


  document.body.appendChild(
    element
  );


  setTimeout(
    function () {

      if (
        element &&
        element.parentNode
      ) {

        element.remove();

      }

    },
    5000
  );

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(
  value
) {

  return String(
    value == null
      ?
      ""
      :
      value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   DEBUG
   ============================================================ */

function debugRequestState() {

  console.log(
    "CURRENT REQUEST STATE:",
    structuredClone(
      RequestState
    )
  );


  return structuredClone(
    RequestState
  );

}
